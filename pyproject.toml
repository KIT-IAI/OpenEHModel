[project]
name = "energy-hub-milp"
version = "0.1.0"
description = "Pyomo-based MILP/MIQP energy hub optimization with MQTT integration"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Energy Hub Team" }
]

dependencies = [
  "pyomo",
  "numpy",
  "pandas",
  "matplotlib",
  "seaborn",
  "paho-mqtt",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/energy-hub/milp"

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --cov=./ --cov-report=term-missing"
testpaths = ["tests"]